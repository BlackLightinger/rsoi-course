[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-platform-prototype"
version = "0.1.0"
description = "Microservice flight search and booking prototype"
requires-python = ">=3.11"
dependencies = [
  "aiokafka==0.12.0",
  "cryptography==44.0.3",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["services*"]

