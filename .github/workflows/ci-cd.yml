name: CI-CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes after building images"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHON_SERVICES: "idp flights tickets loyalty payments statistics gateway"
  ALL_DEPLOYMENTS: "idp flights tickets loyalty payments statistics gateway web"

jobs:
  test:
    name: Test and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -e '.[test]'

      - name: Compile Python services
        run: python -m compileall -q services tests

      - name: Run Python tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s/base >/dev/null

  python-images:
    name: Build and push Python service images
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [idp, flights, tickets, loyalty, payments, statistics, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python-service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  web-image:
    name: Build and push web image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/web:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  image-smoke:
    name: Smoke test Docker images
    if: github.event_name != 'pull_request'
    needs: [python-images, web-image]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GHCR image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Python service images expose /health
        env:
          REGISTRY: ${{ steps.image.outputs.prefix }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cleanup_python_smoke() {
            docker rm -f smoke-idp smoke-flights smoke-tickets smoke-loyalty smoke-payments smoke-statistics smoke-gateway >/dev/null 2>&1 || true
          }
          trap cleanup_python_smoke EXIT
          for service in $PYTHON_SERVICES; do
            container="smoke-$service"
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run -d \
              --name "$container" \
              -p 18000:8000 \
              -e KAFKA_ENABLED=false \
              -e DATA_DIR=/tmp/aeroflow-data \
              -e ADMIN_PASSWORD=admin123 \
              -e GATEWAY_CLIENT_SECRET=gateway-dev-secret \
              -e PARTNER_API_KEY=partner-demo-key \
              "$REGISTRY/$service:$TAG"
            for attempt in $(seq 1 30); do
              if ! docker ps --format '{{.Names}}' | grep -qx "$container"; then
                echo "::error::$container exited before /health became available"
                docker logs "$container" || true
                exit 1
              fi
              if curl -fsS http://127.0.0.1:18000/health >/dev/null; then
                break
              fi
              sleep 1
            done
            if ! curl -fsS http://127.0.0.1:18000/health; then
              echo "::error::$container did not pass /health smoke test"
              docker logs "$container" || true
              exit 1
            fi
            docker rm -f "$container"
          done

      - name: Check web image exposes /healthz
        env:
          REGISTRY: ${{ steps.image.outputs.prefix }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker rm -f smoke-web >/dev/null 2>&1 || true' EXIT
          docker rm -f smoke-web >/dev/null 2>&1 || true
          docker run -d \
            --name smoke-web \
            --add-host gateway:127.0.0.1 \
            --add-host idp:127.0.0.1 \
            -p 18080:80 \
            "$REGISTRY/web:$TAG"
          for attempt in $(seq 1 30); do
            if ! docker ps --format '{{.Names}}' | grep -qx smoke-web; then
              echo "::error::smoke-web exited before /healthz became available"
              docker logs smoke-web || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18080/healthz; then
            echo "::error::web image did not pass /healthz smoke test"
            docker logs smoke-web || true
            exit 1
          fi
          docker rm -f smoke-web

  deploy:
    name: Deploy to Kubernetes
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_K8S_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: image-smoke
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Resolve deployment settings
        id: settings
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GATEWAY_CLIENT_SECRET: ${{ secrets.GATEWAY_CLIENT_SECRET }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::KUBE_CONFIG secret is required for Kubernetes deployment."
            exit 1
          fi
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL:-http://flight.local}" >> "$GITHUB_OUTPUT"

      - name: Configure cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply Kubernetes manifests and runtime secrets
        env:
          PUBLIC_URL: ${{ steps.settings.outputs.public_url }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GATEWAY_CLIENT_SECRET: ${{ secrets.GATEWAY_CLIENT_SECRET }}
          PARTNER_API_KEY: ${{ secrets.PARTNER_API_KEY }}
        run: |
          ADMIN_PASSWORD="${ADMIN_PASSWORD:-admin123}"
          GATEWAY_CLIENT_SECRET="${GATEWAY_CLIENT_SECRET:-gateway-dev-secret}"
          PARTNER_API_KEY="${PARTNER_API_KEY:-partner-demo-key}"
          kubectl apply -k k8s/base
          kubectl -n flight-platform create secret generic flight-platform-secrets \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=GATEWAY_CLIENT_SECRET="$GATEWAY_CLIENT_SECRET" \
            --from-literal=PARTNER_API_KEY="$PARTNER_API_KEY" \
            --from-literal=OIDC_ISSUER="$PUBLIC_URL" \
            --from-literal=WEB_REDIRECT_URIS="$PUBLIC_URL/callback" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Roll out immutable images
        env:
          REGISTRY: ${{ steps.settings.outputs.image_prefix }}
          TAG: ${{ github.sha }}
        run: |
          kubectl -n flight-platform rollout status statefulset/kafka --timeout=240s
          for service in $ALL_DEPLOYMENTS; do
            kubectl -n flight-platform set image "deployment/$service" "$service=$REGISTRY/$service:$TAG"
          done
          for service in $ALL_DEPLOYMENTS; do
            kubectl -n flight-platform rollout status "deployment/$service" --timeout=180s
          done

  post-deploy-smoke:
    name: Post-deploy smoke tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_K8S_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/setup-kubectl@v4

      - name: Configure cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes rollout state
        run: |
          kubectl -n flight-platform rollout status statefulset/kafka --timeout=120s
          for service in $ALL_DEPLOYMENTS; do
            kubectl -n flight-platform rollout status "deployment/$service" --timeout=120s
          done
          kubectl -n flight-platform get pods -o wide
          kubectl -n flight-platform get ingress

      - name: Smoke test deployed HTTP endpoints
        run: |
          set -euo pipefail
          kubectl -n flight-platform get endpoints gateway web idp
          kubectl -n flight-platform port-forward svc/gateway 18080:8000 >/tmp/gateway-port-forward.log 2>&1 &
          gateway_pf=$!
          kubectl -n flight-platform port-forward svc/web 18081:80 >/tmp/web-port-forward.log 2>&1 &
          web_pf=$!
          kubectl -n flight-platform port-forward svc/idp 18082:8000 >/tmp/idp-port-forward.log 2>&1 &
          idp_pf=$!
          cleanup() {
            kill "$gateway_pf" "$web_pf" "$idp_pf" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fail_smoke() {
            echo "::error::Post-deploy smoke test failed"
            kubectl -n flight-platform get pods -o wide || true
            kubectl -n flight-platform get endpoints gateway web idp || true
            echo "--- gateway port-forward log ---"
            cat /tmp/gateway-port-forward.log || true
            echo "--- web port-forward log ---"
            cat /tmp/web-port-forward.log || true
            echo "--- idp port-forward log ---"
            cat /tmp/idp-port-forward.log || true
            exit 1
          }

          wait_for_url() {
            local name="$1"
            local url="$2"
            local pid="$3"
            for attempt in $(seq 1 45); do
              if ! kill -0 "$pid" >/dev/null 2>&1; then
                echo "::error::$name port-forward process exited"
                fail_smoke
              fi
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "::error::$name endpoint $url did not become ready"
            fail_smoke
          }

          wait_for_url gateway http://127.0.0.1:18080/health "$gateway_pf"
          wait_for_url web http://127.0.0.1:18081/healthz "$web_pf"
          wait_for_url idp http://127.0.0.1:18082/health "$idp_pf"

          curl -fsS http://127.0.0.1:18080/health || fail_smoke
          curl -fsS http://127.0.0.1:18081/healthz || fail_smoke
          curl -fsS http://127.0.0.1:18082/.well-known/openid-configuration || fail_smoke
          curl -fsS --get 'http://127.0.0.1:18080/api/flights' \
            --data-urlencode 'origin=Москва' \
            --data-urlencode 'destination=Санкт-Петербург' \
            --data-urlencode 'passengers=1' || fail_smoke
