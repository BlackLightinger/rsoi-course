name: flight-platform

x-python-service: &python-service
  restart: unless-stopped
  environment: &common-environment
    OIDC_INTERNAL_URL: http://idp:8000
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost}
    API_AUDIENCE: flight-platform-api
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_EVENTS_TOPIC: service-events
    GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-gateway-dev-secret}
    DATA_DIR: /data
  depends_on:
    idp:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 12

  idp:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args: { SERVICE: idp }
    restart: unless-stopped
    environment:
      <<: *common-environment
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      WEB_REDIRECT_URIS: ${WEB_REDIRECT_URIS:-http://localhost/callback,http://localhost:5173/callback,http://127.0.0.1/callback,http://127.0.0.1:5173/callback}
    volumes:
      - idp-data:/data
    ports:
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 8s
      timeout: 3s
      retries: 10

  flights:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: flights } }
    volumes: [flights-data:/data]
    ports: ["8002:8000"]

  tickets:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: tickets } }
    volumes: [tickets-data:/data]
    ports: ["8003:8000"]

  loyalty:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: loyalty } }
    volumes: [loyalty-data:/data]
    ports: ["8004:8000"]

  payments:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: payments } }
    volumes: [payments-data:/data]
    ports: ["8005:8000"]

  statistics:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: statistics } }
    volumes: [statistics-data:/data]
    ports: ["8006:8000"]

  gateway:
    <<: *python-service
    build: { context: ., dockerfile: docker/python-service.Dockerfile, args: { SERVICE: gateway } }
    environment:
      <<: *common-environment
      FLIGHTS_URL: http://flights:8000
      TICKETS_URL: http://tickets:8000
      LOYALTY_URL: http://loyalty:8000
      PAYMENTS_URL: http://payments:8000
      STATISTICS_URL: http://statistics:8000
      PARTNER_API_KEY: ${PARTNER_API_KEY:-partner-demo-key}
    depends_on:
      idp: { condition: service_healthy }
      kafka: { condition: service_healthy }
      flights: { condition: service_started }
      tickets: { condition: service_started }
      loyalty: { condition: service_started }
      payments: { condition: service_started }
      statistics: { condition: service_started }
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - gateway
      - idp
    ports:
      - "80:80"

volumes:
  kafka-data:
  idp-data:
  flights-data:
  tickets-data:
  loyalty-data:
  payments-data:
  statistics-data:
