apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: idp-data }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: idp
spec:
  selector: { app: idp }
  ports: [{ port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: idp }
  template:
    metadata:
      labels: { app: idp, tier: identity }
    spec:
      securityContext: { fsGroup: 100 }
      containers:
        - name: idp
          image: ghcr.io/your-org/flight-platform-idp:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: flight-platform-config }
            - secretRef: { name: flight-platform-secrets }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 4
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: idp-data }
