---
apiVersion: v1
kind: Service
metadata: { name: flights }
spec:
  selector: { app: flights }
  ports: [{ port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: tickets }
spec:
  selector: { app: tickets }
  ports: [{ port: 8000, targetPort: http }]
---
apiVersion: v1
