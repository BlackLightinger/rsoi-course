---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: flights }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: flights }
  template:
    metadata:
      labels: { app: flights, tier: domain }
    spec:
      securityContext: { fsGroup: 100 }
      containers:
        -
          name: flights
          image: ghcr.io/your-org/flight-platform-flights:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: flight-platform-config }
            - secretRef: { name: flight-platform-secrets }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 4
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 75m, memory: 96Mi }
            limits: { cpu: 400m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: flights-data }
---
